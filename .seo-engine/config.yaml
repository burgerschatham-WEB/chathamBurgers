  heritage: "Est. 1985 / since 1985 / serving Chatham for 40 years are plain facts and fine. Do NOT claim family ownership, multi-generational ownership, the same owners since 1985, or original/family recipes. The current owner is not the original family."
  story_angle: "Thanks, Chatham — for keeping this place going. Credit the community, not a family lineage."
  reviews: "Use only real, attributable Google reviews quoted with permission, or none. Never invent quotes, names, ratings or review counts. Prefer not to state a star rating or review count at all; if one is stated, it must be Google's current figure, checked on the day of writing."
  fries: "'Hand-cut fries made daily' is fine. No fresh-vs-frozen claims or comparisons. Small / Large / Family are real fry sizes and may be named."
  voice: "Warm, local, plain-spoken. No hype words (e.g. 'elevate', 'indulge', 'mouthwatering', 'culinary journey')."
  domain: "Website is https://chathamburger.com. Online ordering is https://order.toasttab.com/online/chathamburgers (site order page: https://chathamburger.com/order)."

