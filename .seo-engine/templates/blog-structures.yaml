# Blog Structures by Type — Chatham Burgers SEO Engine
# Each type has a distinct voice and section order.
# E-E-A-T injection point marked in each structure.
# Reviews: use only real, attributable Google reviews quoted with permission, or none.
# Never invent quotes, names, ratings or review counts.

structures:

  local_guide:
    description: "Local SEO guide — used for 'best X in Chatham Ontario' type content"
    voice: "Knowledgeable local who knows the area. Warm, direct, plain-spoken. Uses 'we' for Chatham Burgers mentions."
    word_count: "1800-3000"
    sections:
      - "## Introduction — hook with what the reader is looking for + local credibility"
      - "## What Makes a Great [X] — set the criteria before ranking anything"
      - "## Our Pick: [Featured Item] at Chatham Burgers — lead with the hero"
      - "[E-E-A-T: 'Serving Chatham since 1985' fact or first-hand detail; a real attributed Google review only if quoted with permission]"
      - "## Other Options in Chatham — brief honest mentions (1-2 sentences each)"
      - "## What to Order at Chatham Burgers — specific recommendations"
      - "## FAQ — from People Also Ask data"
      - "## Conclusion + CTA — one soft CTA"
    eeat_injection: "After hero section — since-1985 fact or first-hand detail; real permitted review or none"

  comparison:
    description: "X vs Y comparison — used for competitor comparisons and product comparisons"
    voice: "Analytical but fair. Lead with strengths of each. Never trash competitors. Let the data speak."
    word_count: "1800-2800"
    sections:
      - "## Introduction — frame the decision the reader is trying to make"
      - "## Quick Verdict — 2-sentence summary for skimmers"
      - "## [Option A] Overview — strengths first"
      - "## [Option B] Overview — strengths first"
      - "## Side-by-Side Comparison — table format where possible"
      - "[E-E-A-T: Specific first-hand experience or verifiable fact here]"
      - "## Which is Better For You — use-case based recommendation"
      - "## FAQ"
      - "## Conclusion + CTA"
    eeat_injection: "In side-by-side section — specific first-hand detail or verifiable fact"

  how_to:
    description: "How-to / educational guide — for 'how to X' and 'X vs Y' educational content"
    voice: "Patient teacher. Explains the why, not just the what. Specific and concrete, never vague."
    word_count: "1200-2200"
    sections:
      - "## Introduction — problem/question the reader has"
      - "## Why This Matters — motivate before instructing"
      - "## [Step 1 / Factor 1]"
      - "## [Step 2 / Factor 2]"
      - "## [Step 3 / Factor 3]"
      - "[E-E-A-T: First-hand experience from working the flame grill daily]"
      - "## Common Mistakes to Avoid"
      - "## FAQ"
      - "## Conclusion + CTA"
    eeat_injection: "Mid-article — specific first-hand experience from the kitchen"

  thought_leadership:
    description: "Brand story — for 'Thanks, Chatham' content and 'why we do X' content"
    voice: "Grateful and plain-spoken, not boastful. Takes a clear position. Uses 'we' and 'our'. Credits the community. No family-lineage or original-recipe claims."
    word_count: "1500-2500"
    sections:
      - "## Opening — Thanks, Chatham, for keeping this place going"
      - "## The backstory — open since 1985 at 215 Grand Ave W (plain facts only)"
      - "## What Chatham has kept coming back for — specific menu items and habits"
      - "[E-E-A-T: Verifiable fact or first-hand detail; a real attributed Google review only if quoted with permission]"
      - "## What hasn't changed — flame-grilled burgers, hand-cut fries made daily"
      - "## What this means for you — reader relevance"
      - "## FAQ"
      - "## Conclusion + CTA"
    eeat_injection: "After backstory — verifiable fact or first-hand detail; never an invented customer story"

  listicle:
    description: "List format — for 'best X' and 'top Y' content"
    voice: "Helpful curator. Explains WHY each item is on the list, not just that it is."
    word_count: "2000-3500"
    sections:
      - "## Introduction — what criteria you used to build this list"
      - "## #1: [Top Pick] — most detail here"
      - "[E-E-A-T: First-hand detail or verifiable fact after #1 pick]"
      - "## #2-#N: [Other Picks] — 2-4 sentences each"
      - "## Honourable Mentions"
      - "## How to Choose"
      - "## FAQ"
      - "## Conclusion + CTA"
    eeat_injection: "After top pick — first-hand detail; a real attributed Google review only if quoted with permission, or none"
